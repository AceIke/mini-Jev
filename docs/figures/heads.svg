<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img"><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#151d2c" stroke-width="1"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#eef4fc" opacity="0.55"/></pattern><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ar-22d3ee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#22d3ee"/></marker></defs><rect width="1040" height="430" fill="#0a0e17"/><rect width="1040" height="430" fill="url(#grid)" opacity="0.5"/><text x="40.0" y="40.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13" fill="#a3b4cb" text-anchor="start" font-weight="700" letter-spacing="0.14em">THREE PRIMITIVES, ONE CONTEXT VECTOR</text><text x="40.0" y="66.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" fill="#eef4fc" text-anchor="start" font-weight="400">the same u answers every question, so they cannot interfere</text><rect x="40.0" y="160.0" width="150.0" height="96.0" rx="7" fill="#101725" stroke="#22d3ee" stroke-width="1.6"/><text x="115.0" y="198.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="34" fill="#22d3ee" text-anchor="middle" font-weight="700">u</text><text x="115.0" y="228.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#7b8ca4" text-anchor="middle" font-weight="400">[48]</text><line x1="196.0" y1="208.0" x2="292.0" y2="158.0" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#ar-22d3ee)"/><rect x="296.0" y="118.0" width="700.0" height="80.0" rx="7" fill="#101725" stroke="#f472b6" stroke-width="1.3"/><text x="316.0" y="146.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="15" fill="#f472b6" text-anchor="start" font-weight="700">Choice</text><text x="410.0" y="146.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#7b8ca4" text-anchor="start" font-weight="400">pick one of N</text><text x="316.0" y="170.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">softmax(O @ u / sqrt(D))</text><text x="596.0" y="170.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">-&gt;  choice + probabilities</text><text x="980.0" y="146.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#7b8ca4" text-anchor="end" font-weight="400">3 options</text><line x1="196.0" y1="208.0" x2="292.0" y2="258.0" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#ar-22d3ee)"/><rect x="296.0" y="218.0" width="700.0" height="80.0" rx="7" fill="#101725" stroke="#fbbf24" stroke-width="1.3"/><text x="316.0" y="246.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="700">Score</text><text x="410.0" y="246.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#7b8ca4" text-anchor="start" font-weight="400">ordered levels</text><text x="316.0" y="270.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">softmax over levels, then</text><text x="596.0" y="270.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">-&gt;  expected level = sum p_i * i</text><text x="980.0" y="246.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#7b8ca4" text-anchor="end" font-weight="400">3 levels</text><line x1="196.0" y1="208.0" x2="292.0" y2="358.0" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#ar-22d3ee)"/><rect x="296.0" y="318.0" width="700.0" height="80.0" rx="7" fill="#101725" stroke="#a78bfa" stroke-width="1.3"/><text x="316.0" y="346.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="15" fill="#a78bfa" text-anchor="start" font-weight="700">Noul</text><text x="410.0" y="346.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#7b8ca4" text-anchor="start" font-weight="400">yes / no</text><text x="316.0" y="370.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">sigmoid(w_n . u + b_n)</text><text x="596.0" y="370.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">-&gt;  one probability, no confidence</text><text x="980.0" y="346.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#7b8ca4" text-anchor="end" font-weight="400">1 probability</text><text x="40.0" y="424.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#7b8ca4" text-anchor="start" font-weight="400">k = options per question. Confidence is derived from the distribution, so Choice and Score have it and Noul does not.</text><path d="M 10.0 28.0 L 10.0 10.0 L 28.0 10.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><path d="M 10.0 402.0 L 10.0 420.0 L 28.0 420.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><path d="M 1030.0 28.0 L 1030.0 10.0 L 1012.0 10.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><path d="M 1030.0 402.0 L 1030.0 420.0 L 1012.0 420.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><rect x="0.0" y="0.0" width="1040.0" height="430.0" fill="url(#scan)" opacity="0.03"/></svg>
