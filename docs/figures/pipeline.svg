olas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="700">u = s + q</text><text x="166.0" y="420.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#8b9cb3" text-anchor="start" font-weight="400">the only thing any option ever sees</text><text x="584.0" y="398.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#5d6c82" text-anchor="end" font-weight="400">[48]</text><line x1="255.0" y1="338.0" x2="255.0" y2="368.0" stroke="#4ade80" stroke-width="1.8" marker-end="url(#ar-4ade80)"/><line x1="785.0" y1="250.0" x2="785.0" y2="404.0" stroke="#fbbf24" stroke-width="1.4"/><line x1="785.0" y1="404.0" x2="606.0" y2="404.0" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#ar-fbbf24)"/><line x1="375.0" y1="436.0" x2="375.0" y2="466.0" stroke="#22d3ee" stroke-width="1.4"/><line x1="375.0" y1="466.0" x2="255.0" y2="466.0" stroke="#22d3ee" stroke-width="1.4"/><line x1="255.0" y1="466.0" x2="255.0" y2="482.0" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#ar-22d3ee)"/><line x1="375.0" y1="466.0" x2="760.0" y2="466.0" stroke="#22d3ee" stroke-width="1.4"/><line x1="760.0" y1="466.0" x2="760.0" y2="482.0" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#ar-22d3ee)"/><rect x="40.0" y="486.0" width="430.0" height="100.0" rx="7" fill="#101725" stroke="#a78bfa" stroke-width="1.3"/><text x="58.0" y="512.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a78bfa" text-anchor="start" font-weight="700">NOUL HEAD</text><text x="58.0" y="538.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#8b9cb3" text-anchor="start" font-weight="400">w_n . u + b_n  -&gt;  sigmoid</text><text x="58.0" y="556.0" font-family=