<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img"><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#151d2c" stroke-width="1"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#eef4fc" opacity="0.55"/></pattern><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ar-22d3ee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#22d3ee"/></marker></defs><rect width="1040" height="430" fill="#0a0e17"/><rect width="1040" height="430" fill="url(#grid)" opacity="0.5"/><text x="40.0" y="40.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13" fill="#a3b4cb" text-anchor="start" font-weight="700" letter-spacing="0.14em">THE CONTRACT</text><text x="40.0" y="66.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" fill="#eef4fc" text-anchor="start" font-weight="400">state + typed questions -&gt; typed answers</text><rect x="40.0" y="90.0" width="300.0" height="120.0" rx="7" fill="#101725" stroke="#2a3b58" stroke-width="1.2"/><rect x="40.0" y="90.0" width="3.0" height="120.0" rx="0" fill="#4ade80"/><text x="56.0" y="114.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13" fill="#a3b4cb" text-anchor="start" font-weight="700" letter-spacing="0.08em">INPUT</text><text x="56.0" y="128.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">state  ::  str | dict | list</text><text x="56.0" y="147.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">bag   ::  48 counts (32 known + 16 hashed)</text><text x="56.0" y="166.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">text  ::  one state per request</text><rect x="370.0" y="90.0" width="300.0" height="120.0" rx="7" fill="#101725" stroke="#2a3b58" stroke-width="1.2"/><rect x="370.0" y="90.0" width="3.0" height="120.0" rx="0" fill="#fbbf24"/><text x="386.0" y="114.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13" fill="#a3b4cb" text-anchor="start" font-weight="700" letter-spacing="0.08em">QUESTION</text><text x="386.0" y="128.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">Choice  ::  pick one of N</text><text x="386.0" y="147.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">Score   ::  ordered levels</text><text x="386.0" y="166.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">Noul    ::  P(yes) in [0, 1]</text><text x="700.0" y="128.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#7b8ca4" text-anchor="start" font-weight="400">read</text><line x1="676.0" y1="150.0" x2="728.0" y2="150.0" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#ar-22d3ee)"/><rect x="732.0" y="96.0" width="268.0" height="108.0" rx="7" fill="#101725" stroke="#22d3ee" stroke-width="1.4"/><text x="748.0" y="126.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#22d3ee" text-anchor="start" font-weight="700">ONE FORWARD PASS</text><text x="748.0" y="150.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">state read once -&gt; u</text><text x="748.0" y="168.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">all k options scored at once</text><text x="748.0" y="186.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">questions never see each other</text><rect x="40.0" y="250.0" width="960.0" height="150.0" rx="7" fill="#101725" stroke="#2a3b58" stroke-width="1.2"/><rect x="40.0" y="250.0" width="3.0" height="150.0" rx="0" fill="#f472b6"/><text x="56.0" y="274.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13" fill="#a3b4cb" text-anchor="start" font-weight="700" letter-spacing="0.08em">ANSWER</text><text x="62.0" y="292.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" fill="#f472b6" text-anchor="start" font-weight="700">choice</text><text x="62.0" y="316.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">choice        : str</text><text x="62.0" y="334.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">probabilities : {opt: float}</text><text x="62.0" y="352.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">confidence    : float</text><text x="372.0" y="292.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" fill="#f472b6" text-anchor="start" font-weight="700">score</text><text x="372.0" y="316.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">score         : float</text><text x="372.0" y="334.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">legend        : {i: str}</text><text x="372.0" y="352.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">probabilities : {i: float}</text><text x="372.0" y="370.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">confidence    : float</text><text x="682.0" y="292.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" fill="#f472b6" text-anchor="start" font-weight="700">noul</text><text x="682.0" y="316.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">noul          : float</text><text x="682.0" y="334.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12.5" fill="#a3b4cb" text-anchor="start" font-weight="400">(no confidence, by design)</text><text x="40.0" y="424.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#7b8ca4" text-anchor="start" font-weight="400">every answer obeys the same map key as its question; usage reports input tokens only</text><path d="M 10.0 28.0 L 10.0 10.0 L 28.0 10.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><path d="M 10.0 402.0 L 10.0 420.0 L 28.0 420.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><path d="M 1030.0 28.0 L 1030.0 10.0 L 1012.0 10.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><path d="M 1030.0 402.0 L 1030.0 420.0 L 1012.0 420.0" fill="none" stroke="#2a3b58" stroke-width="1.6"/><rect x="0.0" y="0.0" width="1040.0" height="430.0" fill="url(#scan)" opacity="0.03"/></svg>
